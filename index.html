</style></head><body><div id="app">
<header><span class="brand">Marginalia</span><button class="btn" id="nvb" data-c="nvOpen()" aria-label="Mis novelas"></button>

<div id="odu"></div><h4>Copia manual</h4><textarea id="dt"></textarea><p style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:0"><button class="btn" id="dc">Copiar</button><button class="btn" id="di">Importar</button><button class="btn" id="dx">Cerrar</button></p></dialog>
<script>addEventListener('error',function(e){var d=document.createElement('pre');d.style.cssText='position:fixed;z-index:99;left:0;right:0;bottom:0;margin:0;padding:8px 12px;background:#a3452f;color:#fff;font:12px monospace;white-space:pre-wrap';d.textContent='Error: '+e.message+(e.lineno?' (línea '+e.lineno+')':'');(document.body||document.documentElement).appendChild(d)})</script>
<script>
(()=>{

n('scene','Las diez últimas páginas','Las diez últimas páginas del libro no están impresas: están **escritas a mano**. La letra es idéntica a la suya. Cuenta lo que ocurrió ayer por la tarde, y [[Elena]] aparece en ellas.','I. El hallazgo',800,'Descubre la letra idéntica.',{},['misterio']),

n('char','Mateo Rivas','Metódico; trabaja revisando textos o datos. Compra en librerías de lance.','',0,'',{Edad:'Casi cincuenta años',Aspecto:'Pelo corto entrecano, barba cuidada con canas, gafas de montura al aire',Rol:'Protagonista'}),
n('char','El librero','Librero de viejo. ¿Don Anselmo o Julián? Aún es ambiguo.'),
n('char','Elena','Compañera y confidente de [[Mateo Rivas]].'),

n('note','Premisa','Mateo compra una novela de segunda mano cuyas últimas diez páginas están escritas a mano con una letra idéntica a la suya, narrando lo ocurrido ayer por la tarde.')]}}
function norm(d){d.notes.forEach(n=>{n.tags=n.tags||[];n.f=n.f||{};n.syn=n.syn||''});d.od=d.od||{done:false,oh:null};{const td=new Date().toISOString().slice(0,10);if(!d.base||d.base.d!==td)d.base={d:td,w:d.notes.filter(n=>n.type==='scene').reduce((a,n)=>a+words(n.text),0)}}d.pane=d.pane||'stage';d.q='';d.tag='';d.focus=false;d.trash=d.trash||[];d.hist=d.hist||{};d.dg=d.dg||500;d.fs=d.fs||17;d.fw=d.fw||720;d.ff=d.ff||'ser';d.gt='';d.bt='';d.rp='';d.gl=false;d.bk=d.bk||Date.now();d.snaps=d.snaps||[];d.notes.forEach(n=>{n.h=n.h||[];n.date=n.date||''});return d}
function idxLoad(){let x=null;try{x=JSON.parse(localStorage.getItem('scr_idx'))}catch(e){}if(x&&x.list&&x.list.length&&x.list.find(a=>a.id===x.cur))return x;const id='n'+uid();x={cur:id,list:[{id,name:'Mi novela',fold:'Mi novela'}]};try{const old=localStorage.getItem('scr1');if(old)localStorage.setItem('scr_n_'+id,old);localStorage.setItem('scr_idx',JSON.stringify(x))}catch(e){}return x}
let IDX=idxLoad(),PID=IDX.cur;
function load(){try{const r=localStorage.getItem('scr_n_'+PID);if(r)return norm(JSON.parse(r))}catch(e){}return norm(seed())}
let S=load(),tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('scr_n_'+PID,JSON.stringify(S))}catch(e){}},300);odSoon()}
{let t0=null;try{t0=localStorage.getItem('scr_th')}catch(e){}t0=t0||S.theme;if(t0)document.documentElement.dataset.theme=t0}
const today=()=>new Date().toISOString().slice(0,10),tw=()=>S.notes.filter(n=>n.type==='scene').reduce((a,n)=>a+words(n.text),0);
if(!S.base||S.base.d!==today())S.base={d:today(),w:tw()};typo();
const cur=()=>S.notes.find(n=>n.id===S.sel)||S.notes[0],find=t=>S.notes.find(n=>n.title.toLowerCase()===t.trim().toLowerCase());

function go(id){S.sel=id;S.view='write';S.pane='stage';render();save()}
function mk(type,title,ch){const n={id:uid(),type,title,text:{char:'Relaciones:\n\nSecretos:\n',place:'Descripción:\n'}[type]||'',chapter:type==='scene'?(ch||'Capítulo 1'):'',status:'Borrador',goal:0,syn:'',f:{},tags:[],h:[],date:''};S.notes.push(n);return n}

function mvTo(id){const d=S.notes.find(n=>n.id===DR),t=S.notes.find(n=>n.id===id);if(!d||d===t||t.type!=='scene'||d.type!=='scene')return;S.notes=S.notes.filter(n=>n!==d);d.chapter=t.chapter;S.notes.splice(S.notes.indexOf(t),0,d);DR=null;render();save()}

function stag(t){S.tag=S.tag===t?'':t;side()}
function lst(){const c=cur(),q=S.q.toLowerCase(),f=n=>(!q||(n.title+' '+n.text+' '+n.tags.join(' ')).toLowerCase().includes(q))&&(!S.tag||n.tags.includes(S.tag));
const row=n=>`<button class="it ${n.type} ${n.id===c.id?'on':''}" draggable="${n.type==='scene'}" data-drag="${n.id}" data-drop="${n.id}" data-c="go('${n.id}')"><span class="dot"></span>${esc(n.title)}</button>`;let h='';

else{const sc=S.notes.filter(n=>n.type==='scene');CH=[...new Set(sc.map(n=>n.chapter))];h='<h4>Novela</h4>'+CH.map((ch,i)=>`<div class="small" style="margin-top:8px" data-dropch="${i}">${esc(ch)}</div>`+sc.filter(n=>n.chapter===ch).map(row).join('')).join('');
for(const t of['char','place','note']){const l=S.notes.filter(n=>n.type===t);if(l.length)h+=`<h4>${TY[t]}s</h4>`+l.map(row).join('')}}
$('#lst').innerHTML=h}
function side(){const tg=[...new Set(S.notes.flatMap(n=>n.tags))].sort();
$('#side').innerHTML=`<input id="q" type="search" placeholder="Buscar en todo" value="${esc(S.q)}" style="width:100%" aria-label="Buscar"><div class="row"><input id="rp" placeholder="Reemplazar por" value="${esc(S.rp)}" style="flex:1;min-width:0" aria-label="Reemplazar por"><button class="chip" data-c="repl()">Reemplazar todo</button></div>`+(tg.length?`<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${tg.map(t=>`<button class="chip ${S.tag===t?'on':''}" data-c="stag('${t}')">#${esc(t)}</button>`).join('')}</div>`:'')+`<div id="lst"></div>${S.trash.length?`<h4>Papelera</h4>${S.trash.map((t,i)=>`<div class="row"><span class="small" style="flex:1">${esc(t.title)}</span><button class="chip" data-c="rest(${i})">Restaurar</button></div>`).join('')}<button class="chip" data-c="empt()">Vaciar papelera</button>`:''}<div class="add"><input id="nt" placeholder="Título nuevo" aria-label="Título nuevo"><select id="nty">${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="btn" style="margin-top:6px;width:100%" data-c="addN()">Crear</button>`;

function wrap(a,b){const e=$('#ed');if(!e)return;const s=e.selectionStart,t=e.selectionEnd,v=e.value;e.value=v.slice(0,s)+a+v.slice(s,t)+b+v.slice(t);e.setSelectionRange(s+a.length,t+a.length);e.focus();inp()}

function foco(){S.focus=!S.focus;document.body.classList.toggle('focus',S.focus)}
function stage(){cancelAnimationFrame(GA);const n=cur(),st=$('#stage');if(S.view==='graph')return graph(st);if(S.view==='book')return book(st);if(S.view==='board')return board(st);if(S.view==='time')return time(st);if(S.view==='mat')return mat(st);if(S.view==='ai')return aiView(st);if(S.view==='stat')return stats(st);

function nvDel(){if(OD.busy)return;if(!NVC){NVC=1;$('#nvdb').textContent='Pulsa otra vez para borrar «'+NV().name+'» de este equipo';return}NVC=0;const id=PID;IDX.list=IDX.list.filter(x=>x.id!==id);try{localStorage.removeItem('scr_n_'+id)}catch(e){}
let nx=IDX.list[0];if(!nx){nx={id:'n'+uid(),name:'Mi novela',fold:'Mi novela'};IDX.list.push(nx);try{localStorage.setItem('scr_n_'+nx.id,JSON.stringify(blank()))}catch(e){}}
PID=nx.id;IDX.cur=PID;nvIdx();S=load();typo();render();nvUi();odUi()}
async function odNovels(){const e=$('#odl');try{const r=await gx('/children?$top=200&$select=name,folder'),j=r.ok?await r.json():{value:[]};ODN=j.value.filter(x=>x.folder&&!IDX.list.some(n=>n.fold.toLowerCase()===x.name.toLowerCase())).map(x=>x.name);e.innerHTML=ODN.length?ODN.map((n,i)=>`<div class="row"><span class="small" style="flex:1">${esc(n)}</span><button class="chip" data-c="odOpenFolder(${i})">Traer a este equipo</button></div>`).join(''):'<div class="small">No hay más novelas en OneDrive.</div>'}catch(x){odMsg('Error: '+x.message)}}
async function odOpenFolder(i){const f=ODN[i];if(!f||OD.busy)return;nvFlush();const id='n'+uid();IDX.list.push({id,name:f,fold:f});try{localStorage.setItem('scr_n_'+id,JSON.stringify(blank()))}catch(e){}PID=id;IDX.cur=id;nvIdx();S=load();render();await odFirst('down');odUi()}
function book(st){const sc=S.notes.filter(n=>n.type==='scene'),chs=[...new Set(sc.map(n=>n.chapter))],tot=sc.reduce((a,n)=>a+words(n.text),0),goal=sc.reduce((a,n)=>a+(n.goal||0),0);
const txt=chs.map(ch=>'## '+ch+'\n\n'+sc.filter(n=>n.chapter===ch).map(n=>n.text.replace(/\{\{.+?\}\}/g,'').replace(LINK,(m,x)=>{const p=x.split('|');return p[1]||p[0]})).join('\n\n* * *\n\n')).join('\n\n');
st.innerHTML=`<div class="meta"><span class="title" style="font-size:20px">Manuscrito</span><span class="small">${tot} palabras${goal?` de ${goal}`:''} · ${sc.length} escenas</span><button class="btn" id="cp">Copiar manuscrito</button></div><div class="page"><div class="small" style="margin-bottom:14px">${sc.map(n=>`${esc(n.title)}: ${n.status}`).join(' · ')}</div><div class="book">${esc(txt)}</div></div>`;$('#cp').onclick=()=>copy(txt)}
function copy(t){try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}}
function render(){document.body.classList.toggle('focus',!!S.focus);$('#nvb').textContent=NV().name+' ▾';$('#mn').dataset.p=S.pane;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.pane));side();right();stage()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.pane='stage';render()});
document.querySelectorAll('#mnav button').forEach(b=>b.onclick=()=>{S.pane=b.dataset.p;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.focus)foco()});
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=d?'light':'dark';r.dataset.theme=S.theme;try{localStorage.setItem('scr_th',S.theme)}catch(e){}save()};
$('#sync').onclick=()=>{$('#dt').value=JSON.stringify(S);odUi();$('#dlg').showModal()};$('#dx').onclick=()=>$('#dlg').close();$('#nvx').onclick=()=>$('#nvd').close();$('#dc').onclick=()=>{$('#dt').select();copy($('#dt').value);S.bk=Date.now();save()};
$('#di').onclick=()=>{try{const d=JSON.parse($('#dt').value);if(!Array.isArray(d.notes))throw 0;S=norm(d);render();save();$('#dlg').close()}catch(e){$('#dt').value='No se pudo importar: pega aquí una copia generada por Marginalia.'}};
const FN={nvOpen,nvGo,nvNew,nvRen,nvDel,odNovels,odOpenFolder,odLogin,odFirst,odSync,odOut,gopen,aiGo,aiCopy,aiIns,aiNew,gz,gr,gf,go,wrap,addN,mv,del,addC,tpl,stag,rest,empt,repl,pick,foco,pal,palG,spr,rv,snapAll,snapR,leer,openT};
function run(s){const m=/^(\w+)\((.*)\)$/s.exec(s.trim());if(!m||!FN[m[1]])return;const a=[...m[2].matchAll(/'((?:[^'\\]|\\.)*)'|"((?:[^"\\]|\\.)*)"|(-?\d+)/g)].map(x=>x[1]!==undefined?x[1]:x[2]!==undefined?x[2]:+x[3]);FN[m[1]](...a)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-c]');if(t)run(t.dataset.c)});
document.addEventListener('mousedown',e=>{const t=e.target.closest('[data-pick]');if(t){e.preventDefault();pick(+t.dataset.pick)}});
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag]');if(t){DR=t.dataset.drag;try{e.dataTransfer.setData('text/plain',DR)}catch(_){}}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop],[data-dropch]'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(c){e.preventDefault();e.stopPropagation();mvTo(c.dataset.drop);return}const g=e.target.closest('[data-dropch]');if(g){e.preventDefault();dropCh(+g.dataset.dropch)}});
document.addEventListener('change',e=>{const k=e.target.dataset.ch;if(!k)return;const v=e.target.type==='checkbox'?e.target.checked:e.target.value;
if(k==='bt'){S.bt=v;board($('#stage'))}else if(k==='gt'){S.gt=v;stage()}else if(k==='gl'){S.gl=v;stage()}else if(k==='dg'){S.dg=+v||0;right();save()}else if(k==='ff'){S.ff=v;typo();save()}else if(k==='fs'){S.fs=+v||17;typo();save()}else if(k==='fw'){S.fw=+v||720;typo();save()}});
render();
odBack().then(()=>{if(S.od.done&&localStorage.getItem('mg_au'))odSync();else if(localStorage.getItem('mg_au')&&OD.msg)$('#sync').click()});
setInterval(()=>{if(!document.hidden&&S.od.done&&localStorage.getItem('mg_au'))odSync()},60000);
})();
</script></body></html>
